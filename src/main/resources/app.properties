# ShopEase Application Configuration Defaults
app.name=ShopEase
app.port=8080

# Database Configuration
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/shopease;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=

# HikariCP Connection Pool
db.pool.max_size=10
db.pool.min_idle=2
db.pool.connection_timeout_ms=30000
db.pool.idle_timeout_ms=600000
db.pool.max_lifetime_ms=1800000

# Session Configuration (1800 seconds = 30 minutes)
session.timeout.seconds=1800

# AI Chatbot Configuration
ai.chatbot.provider=mock
ai.chatbot.gemini.key=
ai.chatbot.model=gemini-1.5-flash
ai.chatbot.rate_limit_per_minute=10
